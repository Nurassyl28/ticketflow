[project]
name = "ticketflow"
version = "0.1.0"
description = "Event and ticket booking API"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "email-validator>=2,<3",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2.15.0",
    "segno>=1.6,<2",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a PostgreSQL database via TEST_DATABASE_URL"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
